<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#05070d">
<meta name="referrer" content="no-referrer">
<title>VEGA Remote</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://n8n.srv1811772.hstgr.cloud; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#05070d;--panel:rgba(14,24,40,.78);--line:rgba(94,234,255,.16);--line2:rgba(94,234,255,.32);--ac:#5eeaff;--ac2:#7c6cff;--txt:#e6f6ff;--mut:#7e8ca8;--bad:#ff4d6d;--ok:#2ee59d;--warn:#ffc24b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% -10%,rgba(94,234,255,.10),transparent 60%),var(--bg)}
.hide{display:none!important}
/* pairing */
#pair{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:18px;text-align:center}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#effdff 0 9%,#5eeaff 10% 30%,rgba(94,234,255,.25) 31% 46%,transparent 47%);box-shadow:0 0 60px rgba(94,234,255,.35);position:relative}
.orb:before,.orb:after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid transparent;border-top-color:var(--ac);border-left-color:rgba(94,234,255,.5);animation:spin 6s linear infinite}
.orb:after{inset:-24px;border-top-color:transparent;border-right-color:var(--ac2);animation-duration:10s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font:600 20px/1 system-ui;letter-spacing:.5em;margin:6px 0 0;padding-left:.5em}
.sub{color:var(--mut);font-size:14px;max-width:320px}
#code{width:220px;text-align:center;font:600 30px ui-monospace,monospace;letter-spacing:.35em;padding:12px 8px 12px 18px;border-radius:14px;border:1px solid var(--line2);background:rgba(10,18,32,.9);color:var(--txt);outline:none}
#code:focus{border-color:var(--ac)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.primary{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#031018;font-weight:700;padding:12px 28px}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* main */
#main{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(5,7,13,.85);backdrop-filter:blur(10px)}
.mini{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#effdff 0 12%,#5eeaff 13% 38%,rgba(94,234,255,.2) 39% 60%,transparent 61%);flex:none;transition:filter .3s}
.mini.acting{filter:hue-rotate(150deg) saturate(2.2);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.title{flex:1;min-width:0}
.title b{font:600 14px system-ui;letter-spacing:.35em}
#state{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#state i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:1px}
#state.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#state.off i{background:var(--bad)}
.icon{width:38px;height:38px;border-radius:11px;background:rgba(94,234,255,.07);border:1px solid var(--line);color:var(--txt);display:grid;place-items:center;font-size:17px}
#stop{background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.5);color:#ff9fb1;font-weight:700;padding:0 12px;height:38px;border-radius:11px;font-size:13px;letter-spacing:.08em}
#stop.live{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
#log{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:9px}
.m{max-width:84%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;animation:rise .2s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.m .who{display:flex;gap:8px;font:600 10px system-ui;letter-spacing:.2em;opacity:.75;margin-bottom:2px}
.m .who span{margin-left:auto;font:400 10px ui-monospace,monospace;letter-spacing:0;color:var(--mut)}
.m.user{align-self:flex-end;background:rgba(124,108,255,.18);border:1px solid rgba(124,108,255,.4);border-bottom-right-radius:4px}
.m.user .who{flex-direction:row-reverse}.m.user .who span{margin:0 auto 0 0}
.m.vega{align-self:flex-start;background:rgba(94,234,255,.07);border:1px solid var(--line2);border-bottom-left-radius:4px}
.m.vega .who{color:var(--ac)}
.m.pending{opacity:.6}
.m.alert{border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.08)}
.step{align-self:center;font:12px ui-monospace,monospace;color:var(--mut);border:1px dotted var(--line2);border-radius:999px;padding:3px 10px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sys{align-self:center;font-size:12px;color:var(--mut)}
.ap{align-self:stretch;border:1px solid rgba(255,194,75,.65);background:rgba(255,194,75,.08);border-radius:14px;padding:10px 12px}
.ap b{color:var(--warn);font-size:11px;letter-spacing:.2em}
.ap pre{white-space:pre-wrap;font:13px ui-monospace,monospace;margin:6px 0 10px;word-break:break-word}
.ap .row{display:flex;gap:8px}.ap .row button{flex:1;padding:9px}
.yes{background:var(--ok);color:#022;font-weight:700}.no{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid var(--line2)}
.ap.done{opacity:.6}.ap.done .row{display:none}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;border-radius:14px;background:rgba(94,234,255,.06);border:1px solid var(--line)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}
footer{padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(5,7,13,.9)}
.bar{display:flex;gap:8px;align-items:flex-end}
#msg{flex:1;resize:none;max-height:120px;min-height:44px;padding:11px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(10,18,32,.95);color:var(--txt);font:inherit;outline:none}
#msg:focus{border-color:var(--ac)}
#send{width:46px;height:44px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#031018;font-size:18px;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips button{flex:none;background:rgba(94,234,255,.07);border:1px solid var(--line);color:var(--txt);padding:6px 11px;border-radius:999px;font-size:13px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:5}
#sheet .card{width:100%;background:#0b1322;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80%;overflow:auto}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.25em;color:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv span:last-child{color:var(--mut);text-align:right}
.job{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.job small{color:var(--mut);display:block}
.job button{margin-top:6px;padding:6px 12px;background:rgba(255,77,109,.15);color:#ff9fb1;border:1px solid rgba(255,77,109,.4)}
.danger{width:100%;margin-top:16px;padding:12px;background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.45);color:#ff9fb1}
.note{font-size:12px;color:var(--mut);margin-top:12px}
.shot{align-self:stretch;border:1px solid var(--line2);border-radius:14px;padding:6px;background:rgba(94,234,255,.04)}
.shot img{display:block;width:100%;border-radius:9px}
.shot small{display:block;color:var(--mut);font:11px ui-monospace,monospace;margin:5px 4px 0}
#viewer{position:fixed;inset:0;background:#000;z-index:9;display:flex;align-items:center;justify-content:center;overflow:auto}
#viewer img{max-width:none;width:200%;touch-action:pan-x pan-y pinch-zoom}
/* HADES (god mode) */
body.hades{--ac:#ff2a3d;--ac2:#ff7a1a;--line:rgba(255,50,60,.18);--line2:rgba(255,60,60,.38);--txt:#ffe6e2;--mut:#b0807e;background:radial-gradient(120% 60% at 50% -10%,rgba(255,42,61,.16),transparent 60%),#070203}
body.hades .mini{filter:hue-rotate(150deg) saturate(2)}
body.hades .title b{text-shadow:0 0 10px rgba(255,42,61,.8)}
body.hades .m.vega{background:rgba(255,42,61,.07)}
</style>
</head>
<body>
<section id="pair" class="hide">
  <div class="orb"></div>
  <h1>VEGA</h1>
  <div class="sub">Remote control for the VEGA on your laptop. On the laptop, type <b>pair phone</b> in VEGA's chat and enter the code it shows.</div>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
  <button class="primary" id="pairBtn">Connect</button>
  <div class="err" id="pairErr"></div>
  <div class="note">This app only sends what you type to your laptop. It has no access to this phone's microphone, camera, location, files or notifications.</div>
</section>

<section id="main" class="hide">
  <header>
    <div class="mini" id="mini"></div>
    <div class="title"><b>VEGA</b><span id="state"><i></i>Connecting…</span></div>
    <button id="stop" title="Stop everything VEGA is doing">STOP</button>
    <button class="icon" id="menu" aria-label="Status">☰</button>
  </header>
  <div id="log"></div>
  <footer>
    <div class="chips" id="chips">
      <button data-q="Show me the screen">Screen</button>
      <button data-q="Stay awake for 8 hours">Stay awake</button>
      <button data-q="What's on today?">Today</button>
      <button data-q="Give me my morning briefing">Briefing</button>
      <button data-q="Any pending reminders?">Reminders</button>
      <button data-q="What jobs are running?">Jobs</button>
      <button data-q="How is my laptop doing? CPU, memory, battery.">Laptop status</button>
    </div>
    <div class="bar">
      <textarea id="msg" rows="1" placeholder="Tell VEGA what to do…" enterkeyhint="send"></textarea>
      <button id="send" aria-label="Send">➤</button>
    </div>
  </footer>
</section>

<div id="sheet" class="hide"><div class="card" id="sheetCard"></div></div>

<script>
'use strict';
// The app lives on GitHub Pages; it only ever talks to Sir's own n8n relay.
const API = 'https://n8n.srv1811772.hstgr.cloud/webhook/vega-remote';
const HDR = { 'Content-Type': 'application/json' };
const $ = id => document.getElementById(id);
const LS = { get k() { try { return localStorage.getItem('vega.token') || ''; } catch { return ''; } }, set k(v) { try { v ? localStorage.setItem('vega.token', v) : localStorage.removeItem('vega.token'); } catch { } } };
let lastId = 0, status = null, statusAt = null, /* ms timestamp, phone clock */ polling = false, timer = null, failures = 0, waiting = 0;
const pendingCid = new Map(), shown = new Set(), confirms = new Map();

async function api(action, data = {}) {
  const r = await fetch(API, { method: 'POST', headers: HDR, body: JSON.stringify({ action, token: LS.k, ...data }), cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json(); return Array.isArray(d) ? d[0] : d;
}
const persona = () => (status && status.mode === 'hades') ? 'HADES' : 'VEGA';
const fmt = t => { const d = t ? new Date(t) : new Date(); return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase(); };
const log = $('log');
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
function put(el) { const s = atBottom(); log.appendChild(el); if (s) log.scrollTop = log.scrollHeight; return el; }
function msg(who, text, at, cls = '') {
  const m = document.createElement('div'); m.className = 'm ' + who + (cls ? ' ' + cls : '');
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who === 'user' ? 'YOU' : 'VEGA';
  const t = document.createElement('span'); t.textContent = fmt(at); w.appendChild(t); m.appendChild(w);
  if (who !== 'user') w.firstChild.textContent = persona();
  m.appendChild(document.createTextNode(text)); return put(m);
}
function line(cls, text) { const d = document.createElement('div'); d.className = cls; d.textContent = text; return put(d); }
let typingEl = null;
function setTyping(on) { if (on && !typingEl) { typingEl = document.createElement('div'); typingEl.className = 'typing'; typingEl.innerHTML = '<i></i><i></i><i></i>'; put(typingEl); } if (!on && typingEl) { typingEl.remove(); typingEl = null; } if (on && typingEl) log.appendChild(typingEl); }

function approval(id, text) {
  if (confirms.has(id)) return;
  const c = document.createElement('div'); c.className = 'ap';
  c.innerHTML = '<b>VEGA NEEDS YOUR APPROVAL</b><pre></pre><div class="row"><button class="yes">Approve</button><button class="no">Deny</button></div>';
  c.querySelector('pre').textContent = text;
  const answer = async ok => { c.classList.add('done'); c.querySelector('b').textContent = ok ? 'APPROVED' : 'DENIED'; try { await api('confirm', { id, ok }); } catch { } };
  c.querySelector('.yes').onclick = () => answer(true); c.querySelector('.no').onclick = () => answer(false);
  confirms.set(id, c); put(c);
}

function handle(it) {
  const b = it.body || {};
  if (it.kind === 'msg') {
    if (b.cid && pendingCid.has(b.cid)) { const el = pendingCid.get(b.cid); el.classList.remove('pending'); pendingCid.delete(b.cid); return; }
    if (b.who === 'vega') { waiting = Math.max(0, waiting - 1); setTyping(waiting > 0); }
    msg(b.who === 'user' ? 'user' : 'vega', String(b.text || ''), b.at || it.created_at, b.alert ? 'alert' : '');
    if (b.who === 'vega' && typingEl) log.appendChild(typingEl);
  } else if (it.kind === 'step') line('step', String(b.text || ''));
  else if (it.kind === 'confirm') approval(String(b.id), String(b.text || ''));
  else if (it.kind === 'confirm-done') { const c = confirms.get(String(b.id)); if (c && !c.classList.contains('done')) { c.classList.add('done'); c.querySelector('b').textContent = b.ok ? 'APPROVED' : (b.expired ? 'EXPIRED' : 'DENIED'); } }
  else if (it.kind === 'note') line('sys', String(b.text || ''));
  else if (it.kind === 'image' && b.data) {
    const d = document.createElement('div'); d.className = 'shot';
    const im = new Image(); im.alt = 'Laptop screen'; im.src = 'data:' + (b.mime || 'image/jpeg') + ';base64,' + b.data;
    im.onclick = () => { const v = document.createElement('div'); v.id = 'viewer'; const big = new Image(); big.src = im.src; v.appendChild(big); v.onclick = () => v.remove(); document.body.appendChild(v); };
    const cap = document.createElement('small'); cap.textContent = 'Laptop screen \u00b7 ' + fmt(b.at || it.created_at) + ' \u00b7 tap to zoom';
    d.append(im, cap); put(d);
    waiting = Math.max(0, waiting - 1); setTyping(waiting > 0);
  }
}

function renderStatus() {
  const st = $('state'); const age = statusAt ? (Date.now() - statusAt) / 1000 : 1e9;
  const online = age < 45;
  st.className = online ? 'on' : 'off';
  st.lastChild.textContent = !status ? 'Waiting for your laptop…' : online
    ? (status.controlling ? 'Operating your laptop…' : status.busy ? 'Working…' : status.ready ? 'Laptop online · ' + (status.model || status.provider || '') : 'Online · no AI key on the laptop')
    : 'Laptop offline · last seen ' + (statusAt ? fmt(statusAt) : 'never');
  const hades = !!(status && status.mode === 'hades');
  document.body.classList.toggle('hades', hades);
  document.querySelector('.title b').textContent = persona();
  document.title = hades ? 'HADES Remote' : 'VEGA Remote';
  const acting = online && status && (status.controlling || status.busy);
  $('mini').classList.toggle('acting', !!(online && status && status.controlling));
  $('stop').classList.toggle('live', !!acting);
  if (!online && waiting) { /* keep waiting; laptop will pick it up when it wakes */ }
}

async function poll() {
  if (polling || document.hidden || !LS.k) return; polling = true;
  try {
    const d = await api('poll', { after: lastId });
    if (d.auth === false || d.auth === 0) return unpaired('This phone was disconnected from VEGA. Pair it again from the laptop.');
    for (const it of (d.items || [])) { const id = Number(it.id); if (shown.has(id)) continue; shown.add(id); if (id > lastId) lastId = id; handle(it); }
    if (d.status) { status = d.status; statusAt = Date.now() - (Number(d.status_age) || 0) * 1000; }
    failures = 0; renderStatus();
  } catch (e) { failures++; if (failures > 2) { $('state').className = 'off'; $('state').lastChild.textContent = 'Can\'t reach VEGA\'s server (no internet?)'; } }
  finally { polling = false; schedule(); }
}
function schedule() { clearTimeout(timer); if (!document.hidden && LS.k) timer = setTimeout(poll, failures > 2 ? 5000 : 1500); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
setInterval(renderStatus, 5000);

async function send(text) {
  text = String(text || '').trim(); if (!text) return;
  const cid = Math.random().toString(36).slice(2, 10);
  const el = msg('user', text, null, 'pending'); pendingCid.set(cid, el);
  waiting++; setTyping(true);
  try { await api('send', { text, cid }); poll(); }
  catch { el.classList.add('alert'); el.classList.remove('pending'); waiting = Math.max(0, waiting - 1); setTyping(waiting > 0); line('sys', 'Not sent: no connection. Try again.'); }
}
const box = $('msg');
box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(120, box.scrollHeight) + 'px'; });
box.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click(); } });
$('send').onclick = () => { const t = box.value; box.value = ''; box.style.height = 'auto'; send(t); };
$('chips').onclick = e => { const q = e.target.dataset && e.target.dataset.q; if (q) send(q); };
$('stop').onclick = async () => { try { await api('stop'); line('sys', 'Stop sent. VEGA will halt everything.'); waiting = 0; setTyping(false); } catch { line('sys', 'Could not send stop: no connection.'); } };

$('menu').onclick = () => {
  const c = $('sheetCard'); c.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = 'LAPTOP VEGA'; c.appendChild(h);
  const kv = (k, v) => { const r = document.createElement('div'); r.className = 'kv'; const a = document.createElement('span'); a.textContent = k; const b = document.createElement('span'); b.textContent = v; r.append(a, b); c.appendChild(r); };
  const s = status || {};
  kv('Status', $('state').lastChild.textContent);
  kv('Keep awake', s.awakeUntil && Date.parse(s.awakeUntil) > Date.now() ? 'until ' + fmt(s.awakeUntil) : 'off');
  kv('AI', s.ready ? (s.provider || '') + ' · ' + (s.model || '') : 'not connected');
  if (s.system) kv('Laptop', 'CPU ' + s.system.cpu + '% · RAM ' + s.system.mem + '%' + (s.system.battery != null ? ' · battery ' + s.system.battery + '%' : ''));
  const h2 = document.createElement('h3'); h2.textContent = 'JOBS'; h2.style.marginTop = '16px'; c.appendChild(h2);
  const jobs = s.jobs || [];
  if (!jobs.length) { const n = document.createElement('div'); n.className = 'note'; n.textContent = 'No jobs running.'; c.appendChild(n); }
  for (const j of jobs) {
    const d = document.createElement('div'); d.className = 'job'; d.textContent = j.title || j.id;
    const sm = document.createElement('small'); sm.textContent = (j.status || '') + (j.cycles != null ? ' · ' + j.cycles + ' cycles' : ''); d.appendChild(sm);
    if (j.status === 'running' || j.status === 'paused') { const b = document.createElement('button'); b.textContent = 'Stop job'; b.onclick = () => { send('Stop job ' + j.id); hideSheet(); }; d.appendChild(b); }
    c.appendChild(d);
  }
  const un = document.createElement('button'); un.className = 'danger'; un.textContent = 'Disconnect this phone';
  un.onclick = async () => { if (!confirm('Disconnect this phone from VEGA? You will need a new code from the laptop to reconnect.')) return; try { await api('unpair'); } catch { } unpaired(''); hideSheet(); };
  c.appendChild(un);
  const n = document.createElement('div'); n.className = 'note'; n.textContent = 'VEGA Remote only sends what you type here to your laptop. It cannot use this phone\'s microphone, camera, location, files or notifications.'; c.appendChild(n);
  $('sheet').classList.remove('hide');
};
const hideSheet = () => $('sheet').classList.add('hide');
$('sheet').onclick = e => { if (e.target.id === 'sheet') hideSheet(); };

function unpaired(reason) {
  LS.k = ''; clearTimeout(timer); $('main').classList.add('hide'); $('pair').classList.remove('hide');
  $('pairErr').textContent = reason || ''; log.innerHTML = ''; lastId = 0; shown.clear(); status = null;
}
function start() { $('pair').classList.add('hide'); $('main').classList.remove('hide'); renderStatus(); poll(); }
$('code').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); if (e.target.value.length === 6) $('pairBtn').click(); });
$('pairBtn').onclick = async () => {
  const code = $('code').value.trim(); if (code.length !== 6) { $('pairErr').textContent = 'Enter the 6-digit code from the laptop.'; return; }
  $('pairErr').textContent = 'Connecting…';
  try {
    const d = await fetch(API, { method: 'POST', headers: HDR, body: JSON.stringify({ action: 'pair', code, name: (navigator.userAgentData && navigator.userAgentData.platform) || 'Phone' }), credentials: 'omit', referrerPolicy: 'no-referrer' }).then(r => r.json()).then(d => Array.isArray(d) ? d[0] : d);
    if (d && d.token) { LS.k = d.token; $('code').value = ''; $('pairErr').textContent = ''; start(); }
    else $('pairErr').textContent = 'That code didn\'t work. Codes last 10 minutes; type "pair phone" on the laptop for a new one.';
  } catch { $('pairErr').textContent = 'No connection. Check your internet and try again.'; }
};

try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch { }
LS.k ? start() : unpaired('');
